name: Inspect release failure
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-release.yml]
permissions:
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the failed publication log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run view 41413056320 --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/release-failure.log"
          python - <<'PY'
          import os
          from pathlib import Path
          lines = Path(os.environ['RUNNER_TEMP'], 'release-failure.log').read_text().splitlines()
          detail = '\n'.join(lines[-24:])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('## Publication diagnostic\n\n```text\n' + detail + '\n```\n')
          escaped = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=Publication diagnostic::' + escaped)
          PY
